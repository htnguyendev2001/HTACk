name: Android CI

on:
  push:
    branches:
      - master
      - main
      - "feat/**"
  pull_request:
    branches:
      - master
      - main

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: ""
          accept-android-sdk-licenses: true
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-32" "build-tools;32.0.0"
      - name: Check Apps Script syntax
        run: node --check --input-type=commonjs < backend/apps-script/Code.gs
      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:test
